<!DOCTYPE html>
<html>
<head>
    <title>Student Result Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; }
        input { margin: 10px 0; padding: 8px; width: 200px; }
        button { padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .footer { margin-top: 20px; font-size: 12px; color: gray; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Result Predictor</h2>
        <form action="/predict" method="POST">
            <input type="number" step="any" name="study_hours" placeholder="Study Hours (e.g. 5)" required><br>
            <input type="number" step="any" name="attendance" placeholder="Attendance % (e.g. 85)" required><br>
            <input type="number" step="any" name="internal_marks" placeholder="Internal Marks (e.g. 35)" required><br>
            <button type="submit">Predict</button>
        </form>
        {% if prediction %}
            <h3>Prediction: {{ prediction }}</h3>
        {% endif %}
        <div class="footer">Model Version: {{ version }}</div>
    </div>
</body>
</html>
